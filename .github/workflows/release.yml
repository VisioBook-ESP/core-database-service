name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test:cov

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/visiobook-esp/core-database-service:${{ steps.version.outputs.VERSION }}
            ghcr.io/visiobook-esp/core-database-service:latest
          labels: |
            org.opencontainers.image.title=Core Database Service
            org.opencontainers.image.description=Visiobook Core Database Service - Centralized database consolidation microservice
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          # Update chart version to match tag
          sed -i "s/version: .*/version: ${GITHUB_REF#refs/tags/v}/" helm/Chart.yaml
          sed -i "s/appVersion: .*/appVersion: \"${GITHUB_REF#refs/tags/}\"/" helm/Chart.yaml

          # Package the chart
          helm package helm/ --destination ./charts/

          # Create chart index
          helm repo index ./charts/ --url https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            charts/*.tgz
            charts/index.yaml
          body: |
            ## 🚀 Core Database Service ${{ steps.version.outputs.VERSION }}

            ### 📦 Docker Images
            - `ghcr.io/visiobook-esp/core-database-service:${{ steps.version.outputs.VERSION }}`
            - `ghcr.io/visiobook-esp/core-database-service:latest`

            ### ☸️ Helm Chart
            ```bash
            # Add the repository
            helm repo add visiobook https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/

            # Install the chart
            helm install core-database-service visiobook/core-database-service --version ${{ steps.version.outputs.VERSION }}
            ```

            ### 🔧 Installation
            ```bash
            # Development
            helm install core-database-service ./helm/

            # Production
            helm install core-database-service ./helm/ -f ./helm/values-prod.yaml
            ```

            ### 📋 What's Changed
            See the full changelog below for all changes in this release.

      - name: Update latest release
        run: |
          echo "✅ Release ${{ steps.version.outputs.VERSION }} created successfully!"
          echo "🐳 Docker images pushed to ghcr.io/visiobook-esp/core-database-service"
          echo "📦 Helm chart packaged and attached to release"
