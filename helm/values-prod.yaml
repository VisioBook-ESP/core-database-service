# Production values for core-database-service
# These values override the default values.yaml for production environment

# Replica configuration for high availability
replicaCount: 3

# Image configuration
image:
  pullPolicy: Always

# Resource limits and requests for production workload
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Autoscaling enabled for production
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Anti-affinity for pod distribution
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - core-database-service
          topologyKey: kubernetes.io/hostname

# Environment variables for production
env:
  NODE_ENV: production
  LOG_LEVEL: error
  PORT: "3000"
  API_PREFIX: "/api/v1"

# Database configuration for production
database:
  # Use existing secret for credentials in production
  existingSecret: "core-database-secret"
  host: "postgres-cluster.database.svc.cluster.local"
  port: 5432
  name: "visiobook_prod"
  # Production connection pool settings
  maxConnections: 50
  connectionTimeout: 10000

# Redis configuration for production
redis:
  host: "redis-cluster.cache.svc.cluster.local"
  port: 6379
  database: 0
  password: "" # Will be set via secret
  maxRetriesPerRequest: 3

# Istio service mesh configuration for production
istio:
  enabled: true

  # Virtual Service configuration
  virtualService:
    enabled: true
    gateways:
      - istio-system/gateway
    hosts:
      - core-database-service.visiobook.com
    http:
      - match:
          - uri:
              prefix: /api/v1
        route:
          - destination:
              host: core-database-service
              port:
                number: 3000
        retries:
          attempts: 3
          perTryTimeout: 10s
        timeout: 30s
        fault:
          delay:
            percentage:
              value: 0.1
            fixedDelay: 5s

  # Destination Rule configuration with strict policies
  destinationRule:
    enabled: true
    trafficPolicy:
      loadBalancer:
        simple: LEAST_CONN
      circuitBreaker:
        consecutiveErrors: 3
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
        minHealthPercent: 50
      connectionPool:
        tcp:
          maxConnections: 50
          connectTimeout: 10s
        http:
          http1MaxPendingRequests: 5
          maxRequestsPerConnection: 1
          maxRetries: 3
          consecutiveGatewayErrors: 3
          interval: 30s
          baseEjectionTime: 30s

  # Peer Authentication - Strict mTLS for production
  peerAuthentication:
    enabled: true
    mode: STRICT

  # Authorization Policy - Restrict access in production
  authorizationPolicy:
    enabled: true
    rules:
      - from:
          - source:
              principals:
                - "cluster.local/ns/default/sa/api-gateway"
                - "cluster.local/ns/microservices/sa/user-service"
                - "cluster.local/ns/microservices/sa/project-service"
        to:
          - operation:
              methods: ["GET", "POST", "PUT", "DELETE"]
              paths: ["/api/v1/*"]

# Service configuration for production
service:
  type: ClusterIP
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# Security context - stricter for production
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

# Probes with tighter timeouts for production
livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# ConfigMap for production configuration
configMap:
  enabled: true
  data:
    cors.origins: "https://app.visiobook.com,https://admin.visiobook.com"
    api.timeout: "10000"
    api.rateLimit.windowMs: "900000"
    api.rateLimit.max: "1000"
    logging.format: "json"
    logging.level: "error"

# Secrets enabled for production
secrets:
  enabled: true
  data:
    # These will be base64 encoded by Helm
    jwt.secret: "production-jwt-secret-key"
    encryption.key: "production-encryption-key"

# Monitoring enabled for production
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    path: /metrics
    labels:
      app: core-database-service
      environment: production

  prometheus:
    scrape: true
    port: "3000"
    path: "/metrics"

# Network policies enabled for production
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
        - namespaceSelector:
            matchLabels:
              name: microservices
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              name: cache
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

# Additional volumes for production (logs, temp files)
volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs

# Pod annotations for production monitoring
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"
  sidecar.istio.io/inject: "true"
