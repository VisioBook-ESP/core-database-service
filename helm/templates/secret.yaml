{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "core-database-service.fullname" . }}
  labels:
    {{- include "core-database-service.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ .Values.secret.type | default "Opaque" }}
{{- if .Values.secret.stringData }}
stringData:
  {{- with .Values.secret.stringData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  # Database credentials
  {{- if .Values.database.username }}
  DATABASE_USERNAME: {{ .Values.database.username | quote }}
  {{- end }}
  {{- if .Values.database.password }}
  DATABASE_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}

  # Redis credentials
  {{- if .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}

  # JWT secrets
  {{- if .Values.jwt.secret }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  {{- end }}
  {{- if .Values.jwt.refreshSecret }}
  JWT_REFRESH_SECRET: {{ .Values.jwt.refreshSecret | quote }}
  {{- end }}

  # API keys and external service credentials
  {{- if .Values.externalServices.apiKey }}
  EXTERNAL_API_KEY: {{ .Values.externalServices.apiKey | quote }}
  {{- end }}
  {{- if .Values.externalServices.clientSecret }}
  EXTERNAL_CLIENT_SECRET: {{ .Values.externalServices.clientSecret | quote }}
  {{- end }}

  # Encryption keys
  {{- if .Values.encryption.key }}
  ENCRYPTION_KEY: {{ .Values.encryption.key | quote }}
  {{- end }}
  {{- if .Values.encryption.iv }}
  ENCRYPTION_IV: {{ .Values.encryption.iv | quote }}
  {{- end }}
{{- end }}
{{- if .Values.secret.data }}
data:
  {{- with .Values.secret.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
