{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "core-database-service.fullname" . }}
  labels:
    {{- include "core-database-service.labels" . | nindent 4 }}
  {{- with .Values.autoscaling.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "core-database-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- with .Values.autoscaling.customMetrics }}
  {{- range . }}
  - type: {{ .type }}
    {{- if eq .type "Pods" }}
    pods:
      metric:
        name: {{ .metric.name }}
        {{- if .metric.selector }}
        selector:
          {{- toYaml .metric.selector | nindent 10 }}
        {{- end }}
      target:
        type: {{ .target.type }}
        {{- if .target.averageValue }}
        averageValue: {{ .target.averageValue }}
        {{- end }}
        {{- if .target.value }}
        value: {{ .target.value }}
        {{- end }}
    {{- else if eq .type "Object" }}
    object:
      metric:
        name: {{ .metric.name }}
        {{- if .metric.selector }}
        selector:
          {{- toYaml .metric.selector | nindent 10 }}
        {{- end }}
      describedObject:
        apiVersion: {{ .describedObject.apiVersion }}
        kind: {{ .describedObject.kind }}
        name: {{ .describedObject.name }}
      target:
        type: {{ .target.type }}
        {{- if .target.averageValue }}
        averageValue: {{ .target.averageValue }}
        {{- end }}
        {{- if .target.value }}
        value: {{ .target.value }}
        {{- end }}
    {{- else if eq .type "External" }}
    external:
      metric:
        name: {{ .metric.name }}
        {{- if .metric.selector }}
        selector:
          {{- toYaml .metric.selector | nindent 10 }}
        {{- end }}
      target:
        type: {{ .target.type }}
        {{- if .target.averageValue }}
        averageValue: {{ .target.averageValue }}
        {{- end }}
        {{- if .target.value }}
        value: {{ .target.value }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.autoscaling.behavior }}
  behavior:
    {{- if .Values.autoscaling.behavior.scaleDown }}
    scaleDown:
      {{- if .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      {{- end }}
      {{- if .Values.autoscaling.behavior.scaleDown.selectPolicy }}
      selectPolicy: {{ .Values.autoscaling.behavior.scaleDown.selectPolicy }}
      {{- end }}
      {{- if .Values.autoscaling.behavior.scaleDown.policies }}
      policies:
      {{- range .Values.autoscaling.behavior.scaleDown.policies }}
      - type: {{ .type }}
        value: {{ .value }}
        periodSeconds: {{ .periodSeconds }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.autoscaling.behavior.scaleUp }}
    scaleUp:
      {{- if .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      {{- end }}
      {{- if .Values.autoscaling.behavior.scaleUp.selectPolicy }}
      selectPolicy: {{ .Values.autoscaling.behavior.scaleUp.selectPolicy }}
      {{- end }}
      {{- if .Values.autoscaling.behavior.scaleUp.policies }}
      policies:
      {{- range .Values.autoscaling.behavior.scaleUp.policies }}
      - type: {{ .type }}
        value: {{ .value }}
        periodSeconds: {{ .periodSeconds }}
      {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
